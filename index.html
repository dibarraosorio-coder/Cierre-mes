<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub Logístico | Dashboard Business Central</title>
<!-- SheetJS para Exportación a Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Chart.js para Gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --font-main: 'Nunito', -apple-system, sans-serif;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  /* SISTEMA DE TEMAS EJECUTIVOS */
  body[data-theme="corporate"] {
    --bg: #0b1120; --surface: #151e32; --surface2: #1e293b; --border: #334155; --border-light: rgba(51, 65, 85, 0.5);
    --text: #f8fafc; --text-muted: #94a3b8; --text-tertiary: #64748b;
    --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.15);
    --sys-green: #34d399; --sys-yellow: #fbbf24; --sys-orange: #fb923c; --sys-red: #f87171;
    --chart-1: #38bdf8; --chart-2: #818cf8; --chart-3: #c084fc; --chart-4: #f472b6; --chart-5: #fb7185; 
    --chart-6: #fbb117; --chart-7: #4ade80; --chart-8: #2dd4bf; --chart-9: #94a3b8; --chart-10:#e2e8f0; 
  }
  body[data-theme="forest"] {
    --bg: #0b1411; --surface: #121e18; --surface2: #1a2c23; --border: #2d4a3b; --border-light: rgba(45, 74, 59, 0.5);
    --text: #fdfbf7; --text-muted: #a3b3ac; --text-tertiary: #75867f;
    --accent: #d4b58e; --accent-glow: rgba(212, 181, 142, 0.15);
    --sys-green: #4ade80; --sys-yellow: #fcd34d; --sys-orange: #fb923c; --sys-red: #ef4444;
    --chart-1: #d4b58e; --chart-2: #7fa896; --chart-3: #4d7a6b; --chart-4: #e8a365; --chart-5: #d97059; 
    --chart-6: #c45b6d; --chart-7: #9c6c8f; --chart-8: #b39b82; --chart-9: #e6dac3; --chart-10:#5b6e68; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); color: var(--text); font-family: var(--font-main); font-size: 13px; 
    height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
    transition: background 0.4s ease, color 0.4s ease;
  }
  
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .header { 
    flex-shrink: 0; background: var(--surface); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 1000;
  }
  .header h1 { font-size: 16px; font-weight: 800; color: var(--text); display: flex; align-items: center;}
  .header h1 .accent-dot { color: var(--accent); margin: 0 6px;} 
  .header-sub { font-size: 10px; color: var(--text-muted); font-weight: 500;}
  
  .header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .action-row { display: flex; align-items: center; gap: 6px; background: var(--surface2); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border-light);}
  
  .theme-select { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 10px; font-weight: 700; cursor: pointer; outline: none; height: 26px; text-transform: uppercase;}
  .btn-company { background: transparent; color: var(--text-muted); border: none; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;}
  .btn-company.active { background: var(--accent); color: var(--bg); box-shadow: 0 2px 10px var(--accent-glow); }
  
  #upload-status { font-size: 10px; color: var(--sys-green); font-weight: 600; font-family: monospace;}

  #main-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hidden { display: none !important; }

  .tabs-container { flex-shrink: 0; display: flex; gap: 4px; padding: 8px 24px 0; background: var(--surface); border-bottom: 1px solid var(--border);}
  .tab-btn { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-bottom: none; padding: 8px 16px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer; font-weight: 700; font-size: 11px; text-transform: uppercase;}
  .tab-btn.active { color: var(--accent); background: var(--surface2); border-color: var(--accent); }

  .tab-content { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .tab-content.active { display: flex; }

  .scroll-area { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: var(--surface); border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .kpi-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 800; color: var(--text); font-family: monospace;}

  .empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body data-theme="corporate">

<!-- CARGA DE DATOS DESDE GITHUB (O RUTA WEB) -->
<script src="datos_admin.js"></script>

<div class="header">
  <div class="header-left">
    <h1>Hub Logístico <span class="accent-dot">·</span> <span id="dynamic-title" style="color: var(--text-muted);">Dashboard Business Central</span></h1>
    <div class="header-sub" id="header-period">Conectado a la nube...</div> 
  </div>
  
  <div class="header-actions">
      <div class="action-row">
          <select id="theme-selector" class="theme-select" onchange="changeTheme(this.value)">
              <option value="corporate" selected>Corporate Blue</option>
              <option value="forest">Forest Gold</option>
          </select>
          <button id="btn-admin" class="btn-company active" onclick="setEmpresa('ADMIN')">🏢 Administradora</button>
          <button id="btn-inmob" class="btn-company" onclick="setEmpresa('INMOB')">🏘️ Inmobiliaria</button>
      </div>
      <div id="upload-status">Sincronización Activa</div>
  </div>
</div>

<div id="main-content">
  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div class="scroll-area">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Cantidad de SKUs</div>
            <div class="kpi-value" id="kpi-total">—</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Valor del Inventario</div>
            <div class="kpi-value" id="kpi-valor">—</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Volumen de Consumo</div>
            <div class="kpi-value" id="kpi-flujo">—</div>
          </div>
        </div>
        <div class="empty" id="empty-msg">Procesando registros de Business Central...</div>
    </div>
  </div>
</div>

<script>
let RAW_EXCEL_ADMIN = [];
let PROCESSED_DATA = [];

function getBCCol(row, field) {
    if(!row) return null;
    if(field === 'codigo') return row.itemNumber || row.ItemNumber;
    if(field === 'desc') return row.description || row.Description;
    if(field === 'fecha') return row.postingDate || row.PostingDate;
    if(field === 'mov') return row.entryType || row.EntryType;
    if(field === 'cant') return row.quantity !== undefined ? row.quantity : row.Quantity;
    if(field === 'precio') return row.costAmountActual !== undefined ? row.costAmountActual : 0;
    return null;
}

document.addEventListener("DOMContentLoaded", () => {
    if (typeof DATOS_ADMIN !== 'undefined' && Array.isArray(DATOS_ADMIN)) {
        RAW_EXCEL_ADMIN = DATOS_ADMIN;
        processData(RAW_EXCEL_ADMIN);
        document.getElementById('upload-status').innerHTML = `✅ BC Conectado (${RAW_EXCEL_ADMIN.length} reg.)`;
    } else {
        document.getElementById('empty-msg').textContent = "⚠️ No se encontró el archivo 'datos_admin.js' en el repositorio de GitHub.";
    }
});

function processData(jsonData) {
    let totalStock = 0, totalVal = 0, totalMov = 0;
    jsonData.forEach(row => {
        const cant = parseFloat(getBCCol(row, 'cant')) || 0;
        const costo = parseFloat(getBCCol(row, 'precio')) || 0;
        totalStock += cant;
        totalVal += (cant * costo);
        totalMov += Math.abs(cant);
    });

    document.getElementById('kpi-total').textContent = jsonData.length.toLocaleString('es-CL');
    document.getElementById('kpi-valor').textContent = '$' + Math.round(totalVal).toLocaleString('es-CL');
    document.getElementById('kpi-flujo').textContent = Math.round(totalMov).toLocaleString('es-CL') + ' un.';
    document.getElementById('empty-msg').style.display = 'none';
}

function changeTheme(themeName) { document.body.setAttribute('data-theme', themeName); }
function switchTab(t) {}
</script>
</body>
</html>
